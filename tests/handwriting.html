<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oc · 合成手寫測試表</title><style>body{font:16px system-ui;max-width:760px;margin:24px auto;padding:0 16px;background:#10201b;color:#e5eedf}h1{font-size:24px}button,select{font:inherit;padding:12px;margin:4px;border-radius:8px;border:1px solid #71967a}img{display:block;width:100%;max-width:640px;margin-top:20px}pre{white-space:pre-wrap}a{color:#c5e6a4}</style><h1>Oc 合成手寫測試表</h1><p>比照窄時間欄與 30 格排列，筆畫由程式繪製，包含重複及非遞增時間。這是有固定答案的壓力測試，不代表你的筆跡準確率。</p><select id="variant" aria-label="測試情境"><option value="clear">一般藍筆</option><option value="shadow">底部陰影與淡筆畫</option><option value="tight">較密字距與輕微傾斜</option></select><button id="download">下載 PNG 測試表</button><p id="status" role="status"></p><details><summary>展開 30 列標準答案</summary><pre id="answers"></pre></details><img id="sheet" alt="30 格合成手寫時間表"><p><a href="../">返回 Oc</a></p><script type="module">
import{makeForm}from'./handwriting-fixtures.mjs';let currentUrl;
const image=document.getElementById('sheet'),variant=document.getElementById('variant');
function show(){const form=makeForm(variant.value);if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(new Blob([form.svg],{type:'image/svg+xml'}));image.src=currentUrl;document.getElementById('answers').textContent=form.targets.join('\n');}
variant.onchange=show;show();
document.getElementById('download').onclick=async()=>{try{await image.decode();const canvas=document.createElement('canvas');canvas.width=640;canvas.height=1280;canvas.getContext('2d').drawImage(image,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('無法產生圖片');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Oc-handwriting-'+variant.value+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);document.getElementById('status').textContent='PNG 已產生，可回 Oc 選照片，框住完整 30 格時間欄。';}catch(error){document.getElementById('status').textContent=error.message;}};
</script></html>
