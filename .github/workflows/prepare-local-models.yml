name: Prepare pinned local OCR engines
on:
  push:
    branches: [build/local-ocr-models]
    paths: [tools/prepare-local-models.py, .github/workflows/prepare-local-models.yml]
permissions:
  contents: write
concurrency:
  group: oc-local-model-preparation
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'onnx==1.18.0'
      - run: python tools/prepare-local-models.py
      - name: Commit only verified public models and runtime on isolated branch
        run: |
          git add models/local-engines.json models/PaddleOCR-LICENSE models/ppocr-v5-en models/ppocr-v5-ch models/ppocr-v4-en vendor/ort
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add verified pretrained local OCR weights and isolated WASM runtime'
            git push origin HEAD:build/local-ocr-models
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: local-model-assets
          path: |
            models/local-engines.json
            models/PaddleOCR-LICENSE
            models/ppocr-*/
            vendor/ort/
          retention-days: 7
