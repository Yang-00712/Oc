name: Train isolated digit model
on:
  workflow_dispatch:
  push:
    branches: [build/ocr]
    paths: ['tools/train-model.py', '.github/workflows/train-model.yml']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 pillow==11.3.0
      - run: python tools/train-model.py --output model-build --epochs 8
      - uses: actions/upload-artifact@v4
        with:
          name: digit-model
          path: model-build/
          retention-days: 7
